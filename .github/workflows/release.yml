name: Release

# Push a tag like v0.1.0 to build SortJunk.exe and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Check tag matches pyproject version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag does not match pyproject version $ver" }

      - run: python -m pip install -e ".[dev,build]"
      - run: python -m pytest
      - run: python -m PyInstaller packaging/SortJunk.spec --noconfirm

      - name: Package zip and checksums
        shell: pwsh
        run: |
          $name = "SortJunk-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force "release/$name" | Out-Null
          Copy-Item dist/SortJunk.exe, README.md, LICENSE "release/$name/"
          Compress-Archive -Path "release/$name/*" -DestinationPath "release/$name.zip"
          Copy-Item dist/SortJunk.exe release/SortJunk.exe
          Get-FileHash release/*.zip, release/SortJunk.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SortJunk.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
